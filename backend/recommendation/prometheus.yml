# Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'talentflow-monitor'

scrape_configs:
  - job_name: 'talentflow-backend'
    static_configs:
      - targets: ['recommendation:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
