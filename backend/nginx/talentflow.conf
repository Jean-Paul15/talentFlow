# Configuration Nginx - Reverse Proxy avec HTTPS
# Place ce fichier dans: /etc/nginx/sites-available/talentflow

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name talentflow.tg www.talentflow.tg;
    
    return 301 https://$host$request_uri;
}

# HTTPS - API Gateway
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name talentflow.tg www.talentflow.tg;

    # Certificats SSL (Let's Encrypt recommandé)
    ssl_certificate /etc/letsencrypt/live/talentflow.tg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talentflow.tg/privkey.pem;
    
    # SSL Configuration (Best practices)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Proxy to API Gateway
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static Assets (si Next.js frontend servi par Nginx)
    location /_next/static {
        proxy_pass http://localhost:3000;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Health Check (non-authentifié)
    location /health {
        proxy_pass http://localhost:3000/health;
        access_log off;
    }

    # Logs
    access_log /var/log/nginx/talentflow_access.log;
    error_log /var/log/nginx/talentflow_error.log;
}

# HTTPS - Monitoring (Grafana)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitoring.talentflow.tg;

    ssl_certificate /etc/letsencrypt/live/talentflow.tg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talentflow.tg/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Basic Auth (protection Grafana)
    auth_basic "Monitoring Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# Apply rate limiting to specific routes
# (à ajouter dans les locations si nécessaire)
