# Configuration MongoDB optimisée pour production
# Place dans /etc/mongod.conf ou via command dans docker-compose

# === NETWORK ===
net:
  port: 27017
  bindIp: 0.0.0.0

# === STORAGE ===
storage:
  dbPath: /data/db
  journal:
    enabled: true
  engine: wiredTiger
  wiredTiger:
    engineConfig:
      cacheSizeGB: 2  # 50% RAM disponible recommended
      journalCompressor: snappy
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

# === OPERATIONS ===
operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 100  # Log queries > 100ms

# === REPLICATION (pour HA) ===
# Uncomment pour replica set
# replication:
#   replSetName: talentflow-rs
#   oplogSizeMB: 1024

# === SECURITY ===
security:
  authorization: enabled  # Activer auth!

# === LOGGING ===
systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  verbosity: 0

# === PERFORMANCE ===
setParameter:
  # Connection pooling
  connPoolMaxConnectionsPerHost: 100
  
  # Indexing
  internalQueryPlanEvaluationMaxResults: 1000
  
  # Slow query log
  slowMS: 100
