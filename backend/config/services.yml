# Services On-Demand Configuration
services:
  recommendation:
    image: "talentflow-recommendation:latest"
    port: 8001
    health_check: "http://localhost:8001/health"
    timeout_seconds: 300
    min_replicas: 0
    max_replicas: 3
  
  job-sourcing:
    image: "talentflow-job-sourcing:latest"
    port: 8000
    health_check: "http://localhost:8000/health"
    timeout_seconds: 600
    min_replicas: 0
    max_replicas: 2
  
  search-engine:
    image: "talentflow-search:latest"
    port: 8003
    health_check: "http://localhost:8003/health"
    timeout_seconds: 300
    min_replicas: 1
    max_replicas: 5
  
  data-cleaning:
    image: "talentflow-cleaning:latest"
    port: 8002
    health_check: "http://localhost:8002/health"
    timeout_seconds: 600
    min_replicas: 0
    max_replicas: 2

orchestration:
  enabled: true
  cleanup_interval_seconds: 30
  health_check_interval_seconds: 30
  auto_launch:
    - "search-engine"
